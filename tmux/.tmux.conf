# 1. Farben und Terminal-Unterstützung (WICHTIG für Neovim-Farben)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 2. Status Bar unten (optional)
set -g status-style 'bg=#333333 fg=#5eacd3'

# 3. Nahtlose Navigation (Das Herzstück für vim-tmux-navigator)
# Diese Zeilen sorgen dafür, dass Ctrl+h/j/k/l zwischen Tmux-Panes 
# und Neovim-Splits umschalten.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Zusätzlich für Copy-Mode-Navigation (optional)
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# 4. Tmux-Verhalten verbessern
set -s escape-time 0           # Keine Verzögerung beim Esc-Drücken (sehr wichtig für Neovim!)
set -g mouse on                # Mausunterstützung in Tmux aktivieren
set-window-option -g mode-keys vi
